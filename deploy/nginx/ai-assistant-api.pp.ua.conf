server {
    listen 80;
    listen [::]:80;
    server_name ai-assistant-api.pp.ua;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai-assistant-api.pp.ua;

    ssl_certificate /etc/ssl/certs/ai-assistant-api.pp.ua.crt;
    ssl_certificate_key /etc/ssl/private/ai-assistant-api.pp.ua.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AI_ASSISTANT_API_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 51m;

    location / {
        proxy_pass http://127.0.0.1:18473;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
