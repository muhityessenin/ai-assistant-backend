openapi: 3.1.0
info:
  title: AI Assistants Platform API
  version: 1.0.0
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Error:
      type: object
      properties: {error: {type: object}}
security: [{bearerAuth: []}]
paths:
  /auth/register: {post: {security: [], summary: Register organization, responses: {'201': {description: Created}}}}
  /auth/login: {post: {security: [], summary: Login, responses: {'200': {description: Tokens}}}}
  /auth/refresh: {post: {security: [], summary: Rotate refresh token, responses: {'200': {description: Tokens}}}}
  /auth/logout: {post: {security: [], summary: Revoke refresh token, responses: {'204': {description: Logged out}}}}
  /me: {get: {summary: Current user, responses: {'200': {description: Current user}}}}
  /users: {get: {summary: List users, responses: {'200': {description: Page}}}, post: {summary: Create user, responses: {'201': {description: Created}}}}
  /users/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {summary: Get user, responses: {'200': {description: User}}}
    patch: {summary: Update user, responses: {'200': {description: User}}}
    delete: {summary: Deactivate user, responses: {'204': {description: Deactivated}}}
  /assistants: {get: {summary: List accessible assistants, responses: {'200': {description: Page}}}, post: {summary: Create assistant configuration, responses: {'201': {description: Created}}}}
  /assistants/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {summary: Get assistant, responses: {'200': {description: Assistant}}}
    patch: {summary: Update assistant, responses: {'200': {description: Assistant}}}
    delete: {summary: Archive assistant, responses: {'204': {description: Archived}}}
  /assistants/{id}/conversations: {post: {summary: Create conversation, responses: {'201': {description: Created}}}}
  /knowledge-bases: {get: {summary: List knowledge bases, responses: {'200': {description: Page}}}, post: {summary: Create knowledge base, responses: {'201': {description: Created}}}}
  /knowledge-bases/{id}/documents: {get: {summary: List documents, responses: {'200': {description: Page}}}, post: {summary: Upload document multipart file, responses: {'202': {description: Queued}}}}
  /knowledge-bases/{id}/texts: {post: {summary: Queue text training, responses: {'202': {description: Queued}}}}
  /conversations: {get: {summary: List conversations, responses: {'200': {description: Page}}}}
  /conversations/{id}: {get: {summary: Get conversation and messages, responses: {'200': {description: Conversation}}}, patch: {summary: Rename, responses: {'200': {description: Conversation}}}, delete: {summary: Delete, responses: {'204': {description: Deleted}}}}
  /conversations/{id}/messages: {post: {summary: Send message as SSE stream, responses: {'200': {description: text/event-stream}}}}
  /messages/{id}/feedback: {post: {summary: Submit rating and correction, responses: {'201': {description: Feedback}}}}
  /feedback: {get: {summary: Admin feedback list, responses: {'200': {description: Page}}}}
  /admin/stats: {get: {summary: Organization statistics, responses: {'200': {description: Statistics}}}}
